<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Page Not Found | Ziyad A</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="assets/favicons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/transitions.css">
<style>
  .error-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
    z-index: 1;
  }
  .error-code {
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(5rem, 22vw, 11rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, var(--c-ink) 0%, color-mix(in srgb, var(--c-ink) 20%, transparent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem;
  }
  .error-title {
    font-family: "Syne", sans-serif;
    font-weight: 700;
    font-size: clamp(1.25rem, 4vw, 2rem);
    letter-spacing: -0.01em;
    margin-bottom: 0.75rem;
  }
  .error-message {
    font-family: "Inter", sans-serif;
    color: var(--c-secondary);
    max-width: 440px;
    margin-bottom: 2.5rem;
    line-height: 1.6;
  }
  .error-path {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    color: color-mix(in srgb, var(--c-secondary) 70%, transparent);
    margin-bottom: 2.5rem;
    padding: 0.5rem 1rem;
    border: 1px solid var(--c-border-03);
    border-radius: 6px;
    background: color-mix(in srgb, var(--c-ink) 4%, transparent);
  }
  .error-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .error-btn {
    font-family: "JetBrains Mono", monospace;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.9rem 1.75rem;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
    cursor: pointer;
    border: none;
  }
  .error-btn:hover { transform: translateY(-2px); }
  .error-btn.primary {
    background: var(--c-ink);
    color: var(--c-bg);
  }
  .error-btn.secondary {
    background: transparent;
    color: var(--c-ink);
    border: 1px solid var(--c-border-03);
  }
  .error-orbit {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0.5;
    z-index: -1;
  }
  .error-orbit svg { width: min(80vw, 640px); height: auto; }
  .error-node {
    animation: error-pulse 3s ease-in-out infinite;
  }
  @keyframes error-pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .error-node { animation: none; }
  }
</style>
</head>
<body>

<div class="noise-overlay" aria-hidden="true"></div>
<div class="grid-line-v" style="left:8.333%" aria-hidden="true"></div>
<div class="grid-line-v" style="left:50%" aria-hidden="true"></div>
<div class="grid-line-v" style="left:91.666%" aria-hidden="true"></div>

<div class="error-orbit" aria-hidden="true">
  <svg viewBox="0 0 400 400" fill="none">
    <circle cx="200" cy="200" r="120" stroke="var(--c-border-03)" stroke-width="1"/>
    <circle cx="200" cy="200" r="160" stroke="var(--c-border-03)" stroke-width="1"/>
    <circle class="error-node" cx="320" cy="200" r="4" fill="#5c8dff"/>
    <circle class="error-node" cx="200" cy="80" r="3" fill="#5c8dff" style="animation-delay:1s"/>
    <circle class="error-node" cx="80" cy="240" r="3.5" fill="#5c8dff" style="animation-delay:2s"/>
  </svg>
</div>

<main class="error-page" id="main-content">
  <div class="error-code">404</div>
  <h1 class="error-title">This route doesn't resolve.</h1>
  <p class="error-message">
    The page you're looking for was moved, renamed, or never existed —
    like a query against a table that isn't in the schema.
  </p>
  <p class="error-path" id="error-path"></p>
  <div class="error-actions">
    <a class="error-btn primary" href="/">
      <span class="material-symbols-outlined" aria-hidden="true" style="font-size:1rem;">home</span>
      BACK TO HOME
    </a>
    <a class="error-btn secondary" href="/#work">VIEW PROJECTS</a>
  </div>
</main>

<script>
  document.getElementById("error-path").textContent = window.location.pathname;
</script>
</body>
</html>
